spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:insurance;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      data-locations: classpath:db/dev-data.sql
