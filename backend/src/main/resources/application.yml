spring:
  profiles:
    default: dev
  # Transactional outbox: deliver events whose listener did not complete
  # (crash, failure) again when the application starts.
  modulith:
    events:
      republish-outstanding-events-on-restart: true
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 100MB
springdoc:
  # Stable key order, so the exported contract (frontend/openapi.json) diffs cleanly.
  writer-with-order-by-keys: true
  swagger-ui:
    persist-authorization: true
# Health endpoints for the Docker healthcheck. Only health and info are exposed,
# without details; Caddy does not route /actuator, so they are reachable only
# inside the container network.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness and /actuator/health/readiness
      probes:
        enabled: true
      group:
        # Readiness includes the database, so the container only becomes "healthy"
        # once the application has started (Flyway ran) and PostgreSQL answers.
        readiness:
          include: readinessState,db
insurance:
  # POST requests with an Idempotency-Key header are answered once and replayed on retry
  # (see IdempotencyFilter).
  idempotency:
    enabled: true
    retention: PT24H
    stale-after: PT5M
  # Requests per client IP and minute on /api/** (see RateLimitFilter). The demo logins
  # are public, so this protects against mass writes and password guessing.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    writes-per-minute: ${RATE_LIMIT_WRITES_PER_MINUTE:30}
    reads-per-minute: ${RATE_LIMIT_READS_PER_MINUTE:300}
  # Runtime care for the event outbox (see EventPublicationMaintenance).
  events:
    maintenance:
      enabled: true
      retry-interval: PT1M
      retry-older-than: PT5M
      completed-retention: P7D
      # /actuator/health reports DOWN while publications stay incomplete longer than this.
      stuck-after: PT30M
  # Public demo logins. Each password defaults to the username in every profile; set
  # DEMO_*_PASSWORD environment variables to override them.
  security:
    publish-credentials: ${DEMO_PUBLISH_CREDENTIALS:true}
    users:
      - username: customer
        password: ${DEMO_CUSTOMER_PASSWORD:customer}
        role: CUSTOMER
        # Seeded demo customer (Anna Schneider); this login may only report claims for her policies.
        customer-number: DEMO-1001
      - username: clerk
        password: ${DEMO_CLERK_PASSWORD:clerk}
        role: CLERK
      - username: admin
        password: ${DEMO_ADMIN_PASSWORD:admin}
        role: ADMIN
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
# One JSON object per log line (Elastic Common Schema) in production, so logs can be
# searched and filtered by level, logger or requestId (taken from the MDC).
logging:
  structured:
    format:
      console: ecs