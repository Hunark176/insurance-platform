name: CI

on:
  pull_request:
    branches: [main]
  # Pushes to main run this workflow through "Build & Deploy", which calls it
  # as its first job so that nothing is deployed unless the tests pass.
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Type-checks (tsc -b) before bundling; Vite alone does not check types.
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: bash backend/mvnw -f backend/pom.xml verify
      # OpenApiContractExportTest wrote the current contract to backend/target/openapi.json.
      # Regenerate the frontend types from it and fail if the committed files differ,
      # so backend DTO changes cannot silently break the frontend types.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check that frontend API types match the backend contract
        run: |
          cp backend/target/openapi.json frontend/openapi.json
          npx --yes openapi-typescript@7.13.0 frontend/openapi.json \
            --output frontend/src/api/generated/schema.ts --properties-required-by-default
          if ! git diff --exit-code -- frontend/openapi.json frontend/src/api/generated; then
            echo "::error::API contract changed. Run the export test with -Dopenapi.export=true and npm run generate:api-types, then commit the result."
            exit 1
          fi

  # Pull requests only: build the backend image and start it, so Dockerfile and
  # healthcheck problems surface before merge. On main, "Build & Deploy" builds
  # the images itself right after this workflow.
  backend-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t insurance-backend:ci .
      - name: Start container with the in-memory dev profile
        run: |
          docker run -d --name backend -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=dev \
            -e INSURANCE_DEV_H2_TCP_ENABLED=false \
            insurance-backend:ci
      - name: Wait until the Docker healthcheck reports healthy
        run: |
          for attempt in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' backend)
            echo "attempt $attempt: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then break; fi
            sleep 5
          done
          docker logs backend | tail -50
          exit 1
      - name: Verify the process does not run as root
        run: test "$(docker exec backend id -u)" != "0"
      - name: Smoke-test the public API
        run: curl -fsS http://localhost:8080/api/claims?size=1 >/dev/null
