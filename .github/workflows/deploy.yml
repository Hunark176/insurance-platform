name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.image.outputs.prefix }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=${REGISTRY}/${repository}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.prefix }}/backend:latest
            ${{ steps.image.outputs.prefix }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push Caddy image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.prefix }}/caddy:latest
            ${{ steps.image.outputs.prefix }}/caddy:${{ github.sha }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: SSH deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_PREFIX,IMAGE_TAG
          script: |
            set -e
            REPO_DIR="$HOME/insurance-platform"
            TEMP_DIR=$(mktemp -d)
            WORKTREE="$TEMP_DIR/repo"
            cleanup() {
              git -C "$REPO_DIR" worktree remove --force "$WORKTREE" >/dev/null 2>&1 || true
              rmdir "$TEMP_DIR" 2>/dev/null || true
            }
            trap cleanup EXIT
            git -C "$REPO_DIR" fetch --quiet origin main
            git -C "$REPO_DIR" worktree add --quiet --detach "$WORKTREE" "$IMAGE_TAG"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            IMAGE_PREFIX="$IMAGE_PREFIX" IMAGE_TAG="$IMAGE_TAG" docker compose \
              --project-name insurance-platform \
              --env-file "$REPO_DIR/.env" \
              -f "$WORKTREE/docker-compose.prod.yml" pull
            IMAGE_PREFIX="$IMAGE_PREFIX" IMAGE_TAG="$IMAGE_TAG" docker compose \
              --project-name insurance-platform \
              --env-file "$REPO_DIR/.env" \
              -f "$WORKTREE/docker-compose.prod.yml" up -d --remove-orphans
            docker image prune -f