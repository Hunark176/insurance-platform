services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insurance
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: insurance
    ports:
      - "5432:5432"
    volumes:
      - insurance-postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/insurance
      SPRING_DATASOURCE_USERNAME: insurance
      SPRING_DATASOURCE_PASSWORD: insurance
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_started

volumes:
  insurance-postgres-data:
