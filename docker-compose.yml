services:
  postgres:
    # Same major version as production (docker-compose.prod.yml) and the
    # Testcontainers tests, so migrations behave identically everywhere.
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: insurance
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: insurance
    ports:
      - "5432:5432"
    volumes:
      # A PostgreSQL data directory only works with the major version that created
      # it. The volume name contains the version so an older local volume created
      # with PostgreSQL 16 is left untouched instead of failing to start.
      - insurance-postgres15-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U insurance -d insurance
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/insurance
      SPRING_DATASOURCE_USERNAME: insurance
      SPRING_DATASOURCE_PASSWORD: insurance
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  insurance-postgres15-data:
